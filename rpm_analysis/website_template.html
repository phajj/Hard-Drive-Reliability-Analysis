<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Failures by Spin Speed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f3f1;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --s-5700: #2a78d6;
    --s-5900: #eb6834;
    --s-7200: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211;
      --surface: #1a1a19;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --s-5700: #3987e5;
      --s-5900: #d95926;
      --s-7200: #199e70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --s-5700: #3987e5;
    --s-5900: #d95926;
    --s-7200: #199e70;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 24px 16px 32px;
  }
  h1, h2, .afr {
    font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  .sub { color: var(--text-2); margin: 0 0 24px; overflow-wrap: anywhere; }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 699px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card, .chart-card, details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    min-width: 0;
  }
  .card-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  .afr {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    margin: 12px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .caption { color: var(--text-2); font-size: 13px; }
  .detail { color: var(--text-2); font-size: 13px; margin-top: 12px; }
  .models { color: var(--muted); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }

  .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .swatch.rpm-5700 { background: var(--s-5700); }
  .swatch.rpm-5900 { background: var(--s-5900); }
  .swatch.rpm-7200 { background: var(--s-7200); }

  .chart-card { margin-top: 16px; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--text-2);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .chart-wrap {
    position: relative;
    overflow-x: auto;
  }
  #chart-svg {
    display: block;
    width: 100%;
    min-width: 640px;
    height: auto;
  }
  #chart-svg:focus { outline: none; }
  #chart-svg:focus-visible {
    outline: 2px solid var(--text-2);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--muted); stroke-width: 1; }
  .tick-line { stroke: var(--muted); stroke-width: 1; }
  .crosshair { stroke: var(--muted); stroke-width: 1; }
  .tick, .axis-title { fill: var(--muted); font-size: 12px; }
  .dot { stroke: var(--surface); stroke-width: 1.5; }
  .dot.rpm-5700 { fill: var(--s-5700); }
  .dot.rpm-5900 { fill: var(--s-5900); }
  .dot.rpm-7200 { fill: var(--s-7200); }
  .hit { fill: transparent; stroke: none; }

  .tip {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    white-space: nowrap;
    min-width: 170px;
    z-index: 2;
  }
  .tip[hidden] { display: none; }
  .tip .q { font-weight: 600; margin-bottom: 4px; }
  .tip .row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-2);
  }
  .tip .row .cnt {
    margin-left: auto;
    padding-left: 16px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  details { margin-top: 16px; }
  summary { cursor: pointer; font-weight: 500; }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 420px;
    font-size: 13px;
  }
  th, td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--grid);
    text-align: left;
  }
  th { color: var(--text-2); font-weight: 500; }
  th.num, td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .new { color: var(--muted); }

  footer {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    margin-top: 24px;
    overflow-wrap: anywhere;
  }
  footer p { margin: 0 0 6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Drive failures by spin speed</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <section class="cards" id="cards" aria-label="Annualized failure rate by spin speed"></section>

  <section class="chart-card" aria-labelledby="chart-heading">
    <h2 id="chart-heading">Cumulative failures</h2>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart-svg" viewBox="0 0 900 380" width="100%" role="img" tabindex="0" aria-label=""></svg>
      <div class="tip" id="tip" role="presentation" hidden></div>
    </div>
    <p class="note">Each dot is the total number of sampled drives in that RPM class that had failed by the end of that quarter. Totals keep growing with how long each class has been observed, so compare classes using the failure rates above.</p>
  </section>

  <details>
    <summary>Show data table</summary>
    <div class="table-wrap">
      <table id="data-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </details>

  <footer id="footer"></footer>

</div>

<script id="data" type="application/json">__DATA__</script>
<script src="app.js"></script>
</body>
</html>
