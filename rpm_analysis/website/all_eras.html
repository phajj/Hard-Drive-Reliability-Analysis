<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Failures by Spin Speed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f3f1;
    --surface: #fcfcfb;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --s-5700: #2a78d6;
    --s-5900: #eb6834;
    --s-7200: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211;
      --surface: #1a1a19;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --s-5700: #3987e5;
      --s-5900: #d95926;
      --s-7200: #199e70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --s-5700: #3987e5;
    --s-5900: #d95926;
    --s-7200: #199e70;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 24px 16px 32px;
  }
  h1, h2, .afr {
    font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  .sub { color: var(--text-2); margin: 0 0 24px; overflow-wrap: anywhere; }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 699px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card, .chart-card, details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    min-width: 0;
  }
  .card-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  .afr {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    margin: 12px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .caption { color: var(--text-2); font-size: 13px; }
  .detail { color: var(--text-2); font-size: 13px; margin-top: 12px; }
  .models { color: var(--muted); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }

  .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .swatch.rpm-5700 { background: var(--s-5700); }
  .swatch.rpm-5900 { background: var(--s-5900); }
  .swatch.rpm-7200 { background: var(--s-7200); }

  .chart-card { margin-top: 16px; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--text-2);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .chart-wrap {
    position: relative;
    overflow-x: auto;
  }
  #chart-svg {
    display: block;
    width: 100%;
    min-width: 640px;
    height: auto;
  }
  #chart-svg:focus { outline: none; }
  #chart-svg:focus-visible {
    outline: 2px solid var(--text-2);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--muted); stroke-width: 1; }
  .tick-line { stroke: var(--muted); stroke-width: 1; }
  .crosshair { stroke: var(--muted); stroke-width: 1; }
  .tick, .axis-title { fill: var(--muted); font-size: 12px; }
  .dot { stroke: var(--surface); stroke-width: 1.5; }
  .dot.rpm-5700 { fill: var(--s-5700); }
  .dot.rpm-5900 { fill: var(--s-5900); }
  .dot.rpm-7200 { fill: var(--s-7200); }
  .hit { fill: transparent; stroke: none; }

  .tip {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    white-space: nowrap;
    min-width: 170px;
    z-index: 2;
  }
  .tip[hidden] { display: none; }
  .tip .q { font-weight: 600; margin-bottom: 4px; }
  .tip .row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-2);
  }
  .tip .row .cnt {
    margin-left: auto;
    padding-left: 16px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  details { margin-top: 16px; }
  summary { cursor: pointer; font-weight: 500; }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 420px;
    font-size: 13px;
  }
  th, td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--grid);
    text-align: left;
  }
  th { color: var(--text-2); font-weight: 500; }
  th.num, td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .new { color: var(--muted); }

  footer {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    margin-top: 24px;
    overflow-wrap: anywhere;
  }
  footer p { margin: 0 0 6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Drive failures by spin speed</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <section class="cards" id="cards" aria-label="Annualized failure rate by spin speed"></section>

  <section class="chart-card" aria-labelledby="chart-heading">
    <h2 id="chart-heading">Cumulative failures</h2>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart-svg" viewBox="0 0 900 380" width="100%" role="img" tabindex="0" aria-label=""></svg>
      <div class="tip" id="tip" role="presentation" hidden></div>
    </div>
    <p class="note">Each dot is the total number of sampled drives in that RPM class that had failed by the end of that quarter. Totals keep growing with how long each class has been observed, so compare classes using the failure rates above.</p>
  </section>

  <details>
    <summary>Show data table</summary>
    <div class="table-wrap">
      <table id="data-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </details>

  <footer id="footer"></footer>

</div>

 "TOSHIBA MG08ACA16TA", "TOSHIBA MG08ACA16TE", "TOSHIBA MG08ACA16TEY", "TOSHIBA MG09ACA16TE", "TOSHIBA MG10ACA20TE", "TOSHIBA MG11ACA24TE", "WDC WUH721414ALE6L4", "WDC WUH721816ALE6L0", "WDC WUH721816ALE6L4", "WDC WUH722222ALE6L4", "WDC WUH722626ALE6L4"]}], "meta": {"sample_file": "sample_all_eras.parquet", "drives": 15000, "failures": 1204, "first_seen_min": "2013-04-10", "first_seen_max": "2026-09-29", "data_end": "2026-09-30", "generated": "2026-11-15"}}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SVG_NS = "http://www.w3.org/2000/svg";
  var META = DATA.meta;
  var SUMMARY = DATA.summary;
  var CLASSES = SUMMARY.map(function (c) { return c.rpm; });
  var QUARTERS = DATA.quarters;
  var N = QUARTERS.length;

  /* Running totals per class: CUM[rpm][i] = failures up to and including quarter i */
  var CUM = {};
  CLASSES.forEach(function (rpm) {
    var run = 0;
    CUM[rpm] = DATA.series[rpm].map(function (v) { run += v; return run; });
  });

  function $(id) { return document.getElementById(id); }
  function fmt(n, digits) {
    return Number(n).toLocaleString("en-US", {
      minimumFractionDigits: digits || 0,
      maximumFractionDigits: digits || 0
    });
  }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function s(tag, attrs, parent) {
    var e = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }
  function label(rpm) { return rpm + " RPM"; }

  /* Subtitle */
  var perClass = Array.from(new Set(SUMMARY.map(function (c) { return c.drives; })));
  var perClassText = perClass.length === 1
    ? fmt(perClass[0])

  $("subtitle").textContent =
    "Backblaze drive stats · " + fmt(META.drives) + " drives, " + perClassText +
    " per speed class · drives first seen " + META.first_seen_min + " to " +
    META.first_seen_max + ", followed through " + META.data_end;

  /* Failure-rate cards */
  var cards = $("cards");
  SUMMARY.forEach(function (c) {
    var card = h("article", "card");
    var lab = h("div", "card-label");
    lab.appendChild(h("span", "swatch rpm-" + c.rpm));
    lab.appendChild(h("span", "", label(c.rpm)));
    card.appendChild(lab);
    card.appendChild(h("div", "afr", c.afr.toFixed(2) + "%"));
    card.appendChild(h("div", "caption", "annualized failure rate"));
    card.appendChild(h("div", "detail",
      fmt(c.failures) + " failures · " + fmt(c.drive_years) + " drive-years · " +
      fmt(c.drives) + " drives"));
    var m = c.models;
    card.appendChild(h("div", "models",
      m.length + (m.length === 1 ? " model: " : " models: ") + m.join(", ")));
    cards.appendChild(card);
  });

  /* Legend */
  var legend = $("legend");
  CLASSES.forEach(function (rpm) {
    var item = h("span");
    item.appendChild(h("span", "swatch rpm-" + rpm));
    item.appendChild(document.createTextNode(label(rpm)));
    legend.appendChild(item);
  });

  /* Chart geometry */
  var W = 900, H = 380;
  var M = { top: 16, right: 16, bottom: 44, left: 48 };
  var plotL = M.left, plotR = W - M.right, plotT = M.top, plotB = H - M.bottom;
  var plotW = plotR - plotL, plotH = plotB - plotT;
  var slotW = plotW / N;
  var OFFSETS = [-4, 0, 4];

  function xCenter(i) { return plotL + (i + 0.5) * slotW; }

  var maxVal = 0;
  CLASSES.forEach(function (rpm) {
    CUM[rpm].forEach(function (v) { if (v > maxVal) maxVal = v; });
  });

  var STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
  function niceScale(maxv) {
    // First pass: the smallest step giving 4-6 ticks (including 0).
    // Second pass: the smallest step giving at most 6 ticks, so the axis never gets crowded.
    var passes = [
      function (count) { return count >= 4 && count <= 6; },
      function (count) { return count <= 6; }
    ];
    for (var p = 0; p < passes.length; p++) {
      for (var k = 0; k < STEPS.length; k++) {
        var step = STEPS[k];
        var top = Math.max(1, Math.ceil(maxv / step)) * step;
        if (passes[p](top / step + 1)) return { step: step, top: top };
      }
    }
    throw new Error("no axis scale fits");
  }
  var scale = niceScale(maxVal);
  function yScale(v) { return plotB - (v / scale.top) * plotH; }

  var svg = $("chart-svg");
  var wrap = $("chart-wrap");
  var tip = $("tip");

    SUMMARY.map(function (c) { return label(c.rpm) + " " + fmt(c.failures); }).join(", ") +
    ". Use the Left and Right arrow keys to move between quarters and Escape to hide the tooltip.");

  for (var t = 0; t <= scale.top; t += scale.step) {
    s("line", { class: "grid", x1: plotL, x2: plotR, y1: yScale(t), y2: yScale(t) }, svg);
    s("text", { class: "tick", x: plotL - 8, y: yScale(t) + 4, "text-anchor": "end" }, svg)
      .textContent = fmt(t);
  }
  var yTitle = s("text", {
    class: "axis-title",
    x: 0, y: 0,
    "text-anchor": "middle",
    transform: "translate(14," + ((plotT + plotB) / 2) + ") rotate(-90)"
  }, svg);
  yTitle.textContent = "Total failures";

  /* X-axis baseline, ticks and year labels */
  s("line", { class: "baseline", x1: plotL, x2: plotR, y1: plotB, y2: plotB }, svg);
  QUARTERS.forEach(function (q, i) {
    var m = q.match(/^(\d{4}) Q1$/);
    var year = m ? m[1] : (i === 0 ? q.slice(0, 4) : null);
    if (year === null) return;
    var x = xCenter(i);
    s("line", { class: "tick-line", x1: x, x2: x, y1: plotB, y2: plotB + 4 }, svg);

  s("text", {
    class: "axis-title",

  var dotsByIdx = [];
  for (var i = 0; i < N; i++) dotsByIdx.push([]);

    for (var i = 0; i < N; i++) {
      var v = series[i];
      var c = s("circle", {
        class: "dot rpm-" + rpm,
        cx: xCenter(i) + OFFSETS[ci],
        cy: yScale(v),
        r: 4
      }, svg);
      dotsByIdx[i].push(c);
    }
  });

  var crosshair = s("line", {
    class: "crosshair",
    x1: 0, x2: 0, y1: plotT, y2: plotB,

  }

  var shown = null;
  var hoverIdx = null;
  var keyIdx = null;
  var keyFocus = false;

  // Writes "total (+new)" for class rpm in quarter i; the "(+new)" part is muted.
  function appendCount(parent, rpm, i) {
    parent.appendChild(document.createTextNode(fmt(CUM[rpm][i]) + " "));
    parent.appendChild(h("span", "new", "(+" + fmt(DATA.series[rpm][i]) + ")"));
  }

  function setRadius(i, r) {
    dotsByIdx[i].forEach(function (c) { c.setAttribute("r", r); });
  }

  function fillTip(i) {
    while (tip.firstChild) tip.removeChild(tip.firstChild);
    tip.appendChild(h("div", "q", QUARTERS[i]));
    CLASSES.forEach(function (rpm) {
      var row = h("div", "row");
      row.appendChild(h("span", "swatch rpm-" + rpm));
      row.appendChild(h("span", "", label(rpm)));
      var cnt = h("span", "cnt");
      appendCount(cnt, rpm, i);
      row.appendChild(cnt);
      tip.appendChild(row);
    });
  }

  function placeTip(clientX, clientY) {
    var wr = wrap.getBoundingClientRect();
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var sl = wrap.scrollLeft, st = wrap.scrollTop;
    var visR = sl + wrap.clientWidth;
    var x = clientX - wr.left + sl + 14;
    if (x + tw > visR - 4) x = clientX - wr.left + sl - tw - 14;
    x = Math.max(sl + 4, Math.min(x, visR - tw - 4));

    y = Math.max(st + 4, Math.min(y, st + wrap.clientHeight - th - 4));

    tip.style.top = y + "px";
  }

  function update(evt) {
    var idx = null;
    if (hoverIdx !== null) idx = hoverIdx;
    else if (keyFocus && keyIdx !== null) idx = keyIdx;

    if (shown !== null && shown !== idx) setRadius(shown, 4);
    shown = idx;

    if (idx === null) {
      crosshair.setAttribute("visibility", "hidden");
      tip.hidden = true;
      return;
    }

    var xc = xCenter(idx);
    crosshair.setAttribute("x1", xc);
    crosshair.setAttribute("x2", xc);
    crosshair.setAttribute("visibility", "visible");
    setRadius(idx, 6);
    fillTip(idx);
    tip.hidden = false;

    var r = svg.getBoundingClientRect();
    var sc = r.width / W;
    if (evt && typeof evt.clientX === "number") {
      placeTip(evt.clientX, evt.clientY);
    } else {
      placeTip(r.left + xc * sc, r.top + plotT * sc);
    }

    rect.addEventListener("mouseenter", function (e) { hoverIdx = i; update(e); });

    update();
  });

    keyFocus = false;
    update();
  });

    } else if (e.key === "ArrowRight") {

  var tbody = document.querySelector("#data-table tbody");
  var headRow = h("tr");
  headRow.appendChild(h("th", "", "Quarter"));
  CLASSES.forEach(function (rpm) { headRow.appendChild(h("th", "num", label(rpm) + " (total, +new)")); });
  thead.appendChild(headRow);

  QUARTERS.forEach(function (q, i) {
    var tr = h("tr");
    tr.appendChild(h("td", "", q));
    CLASSES.forEach(function (rpm) {
      var td = h("td", "num");
      appendCount(td, rpm, i);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });


  /* Footer */
  var footer = $("footer");
  footer.appendChild(h("p", "", "A drive’s failure date is the last day it reported. Backblaze marks failure = 1 on that day."));
  footer.appendChild(h("p", "", "AFR (annualized failure rate) = failures ÷ drive-years, where drive-years = days observed ÷ 365."));
  footer.appendChild(h("p", "", "Source: Backblaze Hard Drive Data, sample file " + META.sample_file + "."));
  footer.appendChild(h("p", "", "Generated " + META.generated + "."));
})();
</script>
